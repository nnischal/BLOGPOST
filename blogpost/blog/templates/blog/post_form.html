{% extends 'blog/base.html' %}
{% block title %}New/Edit Post{% endblock %}
{% block content %}
  <h1 class="text-2xl font-bold text-blue-700 mb-6">Add New Post</h1>

  <form method="POST" class="space-y-6 bg-white p-8 rounded-xl shadow-md">
    {% csrf_token %}

    {% for field in form %}
      <div>
        <label class="block text-gray-700 font-medium mb-1">{{ field.label_tag }}</label>
        {{ field }}
        {% if field.errors %}
          <p class="text-sm text-red-500">{{ field.errors }}</p>
        {% endif %}
      </div>
    {% endfor %}

    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg transition">
      Save Post
    </button>
  </form>
{% endblock %}
