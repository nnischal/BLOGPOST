<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}My Blog{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">
  <div class="max-w-3xl mx-auto p-6">
    <!-- Header -->
    <header class="mb-8">
      <h1 class="text-4xl font-extrabold text-center text-blue-600 mb-4">
        <a href="{% url 'post_list' %}" class="hover:underline">My Blog</a>
      </h1>

      <!-- Navigation Bar -->
      <nav class="flex justify-center space-x-6 text-lg font-medium">
        <a href="{% url 'post_list' %}" class="text-gray-700 hover:text-blue-600 transition">Home</a>
        <a href="{% url 'post_create' %}" class="text-gray-700 hover:text-blue-600 transition">Add New Post</a>
      </nav>
    </header>

    <!-- Main Content -->
    <main class="bg-white p-6 rounded-xl shadow-md">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
