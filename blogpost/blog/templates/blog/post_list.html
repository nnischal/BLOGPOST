{% extends 'blog/base.html' %}

{% block content %}
<div class="max-w-4xl mx-auto p-6">
    <h1 class="text-3xl font-bold mb-4">Blog Posts</h1>

    {% for post in posts %}
    <div class="bg-white rounded-xl shadow p-4 mb-4">
        <h2 class="text-2xl font-semibold">{{ post.title }}</h2>
        <p class="text-gray-600">{{ post.content|truncatechars:150 }}</p>
        <p class="text-sm text-gray-400">Created on: {{ post.created_at }}</p>
        <a href="{% url 'post_create' %}">Add New Post</a>

        <a href="{% url 'post_detail' post.pk %}" class="text-blue-500">Read more</a>
    </div>
    {% empty %}
    <p>No posts yet.</p>
    {% endfor %}
</div>
{% endblock %}
