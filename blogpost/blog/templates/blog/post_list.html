{% extends 'blog/base.html' %}

{% block content %}
<div class="max-w-4xl mx-auto p-6">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-4xl font-bold text-blue-700">Blog Posts</h1>
        <a href="{% url 'post_create' %}" class="inline-block bg-blue-600 text-white px-4 py-2 rounded-lg shadow hover:bg-blue-700 transition">
            ➕ Add New Post
        </a>
    </div>

    {% for post in posts %}
    <div class="bg-white rounded-xl shadow-md p-6 mb-6 hover:shadow-lg transition">
        <h2 class="text-2xl font-bold text-gray-800 mb-2">{{ post.title }}</h2>
        <p class="text-gray-700 mb-3">{{ post.content|truncatechars:150 }}</p>
        <p class="text-sm text-gray-400 mb-4">📅 {{ post.created_at|date:"F j, Y, g:i a" }}</p>
        <a href="{% url 'post_detail' post.pk %}" class="inline-block text-blue-600 hover:underline font-medium">
            📖 Read more
        </a>
    </div>
    {% empty %}
    <p class="text-gray-500 italic">No posts yet.</p>
    {% endfor %}
</div>
{% endblock %}
